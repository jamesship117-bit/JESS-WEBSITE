<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Registration is not available — [YOUR AGENCY NAME] client area." />
    <title>Access Restricted — [YOUR AGENCY NAME]</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page page--register auth-page" data-page="register">
    <div class="page-bg" aria-hidden="true">
      <div class="page-bg__grid"></div>
      <div class="page-bg__dots"></div>
      <div class="page-bg__noise"></div>
    </div>

    <div class="custom-cursor" aria-hidden="true">
      <div class="custom-cursor__dot"></div>
      <div class="custom-cursor__ring"></div>
    </div>

    <header id="site-header" class="site-header"></header>

    <main id="main-content" class="auth-page__main">
      <div class="auth-card" id="register-access-card" aria-labelledby="register-denied-heading">
        <div class="auth-card__logo">
          <a href="index.html" class="logo" aria-label="[YOUR AGENCY NAME] home">
            <span class="logo__accent">[YOUR</span><span class="logo__rest"> AGENCY NAME]</span>
          </a>
        </div>
        <div class="register-access-denied__icon" aria-hidden="true">
          <svg class="register-access-denied__lock" width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M7 11V8a5 5 0 0 1 10 0v3"
              stroke="var(--accent-cyan, #22d3ee)"
              stroke-width="2"
              stroke-linecap="round"
            />
            <rect x="5" y="11" width="14" height="11" rx="2" stroke="#f87171" stroke-width="2" />
            <circle cx="12" cy="16.5" r="1.25" fill="#f87171" />
          </svg>
        </div>
        <h1 id="register-denied-heading" class="auth-card__title">Access Restricted</h1>
        <p class="auth-card__lead register-access-denied__sub">
          Account registration is by invitation only. If you need access, contact your administrator.
        </p>
        <a href="login.html" class="btn btn--primary btn--glow btn--magnetic" style="width: 100%; margin-top: 0.5rem; text-align: center; text-decoration: none"
          >Back to Login</a
        >
        <div class="auth-card__footer">
          <p style="margin: 0"><a href="index.html">Back to Home</a></p>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="main.js"></script>
    <script>
      (function () {
        "use strict";
        function sessionValid() {
          try {
            var raw = localStorage.getItem("agency_session");
            if (!raw) {
              return false;
            }
            var s = JSON.parse(raw);
            if (!s || !s.userId || !s.expiresAt) {
              return false;
            }
            if (Date.now() > new Date(s.expiresAt).getTime()) {
              localStorage.removeItem("agency_session");
              return false;
            }
            return true;
          } catch (e) {
            return false;
          }
        }
        function userExistsForSession() {
          if (!sessionValid()) {
            return false;
          }
          var u = window.AgencyAuth && AgencyAuth.getCurrentUser();
          return !!u;
        }
        if (userExistsForSession()) {
          window.location.replace("client-area.html");
        }
      })();
    </script>
  </body>
</html>
