<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Admin Panel — [YOUR AGENCY NAME]" />
    <title>Admin Panel — [YOUR AGENCY NAME]</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page page--admin admin-page auth-pending" data-page="admin">
    <!-- Sync: session + admin role — keep in sync with auth.js getSession / user.role -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("agency_session");
          if (!raw) {
            window.location.replace("login.html");
            return;
          }
          var s = JSON.parse(raw);
          if (!s || !s.userId || !s.expiresAt || Date.now() > new Date(s.expiresAt).getTime()) {
            localStorage.removeItem("agency_session");
            window.location.replace("login.html");
            return;
          }
          var users = JSON.parse(localStorage.getItem("agency_users") || "[]");
          var user = null;
          for (var i = 0; i < users.length; i++) {
            if (users[i].id === s.userId) {
              user = users[i];
              break;
            }
          }
          if (!user || user.role !== "admin") {
            window.location.replace("client-area.html");
            return;
          }
        } catch (e) {
          window.location.replace("login.html");
        }
      })();
    </script>

    <div class="page-bg" aria-hidden="true">
      <div class="page-bg__grid"></div>
      <div class="page-bg__dots"></div>
      <div class="page-bg__noise"></div>
    </div>

    <div class="custom-cursor" aria-hidden="true">
      <div class="custom-cursor__dot"></div>
      <div class="custom-cursor__ring"></div>
    </div>

    <header id="site-header" class="site-header"></header>

    <main id="main-content" class="admin-layout">
      <aside class="admin-sidebar" role="tablist" aria-label="Admin sections">
        <button type="button" class="admin-tab is-active" role="tab" aria-selected="true" data-admin-tab="overview">Overview</button>
        <button type="button" class="admin-tab" role="tab" aria-selected="false" data-admin-tab="users">Users</button>
        <button type="button" class="admin-tab" role="tab" aria-selected="false" data-admin-tab="projects">Projects</button>
        <button type="button" class="admin-tab" role="tab" aria-selected="false" data-admin-tab="messages">Messages</button>
        <button type="button" class="admin-tab" role="tab" aria-selected="false" data-admin-tab="settings">Settings</button>
      </aside>

      <div class="admin-panels">
        <section class="admin-panel glass glass--static" id="admin-panel-overview" data-admin-panel="overview">
          <h1 class="service-card__title" style="margin-top: 0">Overview</h1>
          <div class="admin-stat-grid" id="admin-overview-stats"></div>
          <h2 class="section__eyebrow" style="margin-top: 2rem">Recent registrations</h2>
          <div id="admin-recent-users" class="admin-table-wrap"></div>
          <h2 class="section__eyebrow" style="margin-top: 2rem">Recent activity</h2>
          <ul class="activity-list" id="admin-activity-feed"></ul>
        </section>

        <section class="admin-panel glass glass--static" id="admin-panel-users" data-admin-panel="users" hidden>
          <h1 class="service-card__title" style="margin-top: 0">Users</h1>
          <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0">
            <input type="search" id="admin-user-search" placeholder="Search name or email…" aria-label="Search users" style="flex: 1; min-width: 200px; padding: 0.65rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: inherit" />
            <button type="button" class="btn btn--primary btn--magnetic" id="admin-add-user-toggle">Add User</button>
          </div>
          <div id="admin-users-table" class="admin-table-wrap"></div>
        </section>

        <section class="admin-panel glass glass--static" id="admin-panel-projects" data-admin-panel="projects" hidden>
          <h1 class="service-card__title" style="margin-top: 0">Projects</h1>
          <button type="button" class="btn btn--primary btn--magnetic" id="admin-add-project-toggle" style="margin: 1rem 0">Add Project</button>
          <div id="admin-add-project-form" class="glass glass--static" style="display: none; padding: 1rem; margin-bottom: 1rem">
            <form id="admin-project-form" class="note-form" style="margin: 0">
              <div class="field">
                <label for="ap-name">Project name</label>
                <input id="ap-name" required />
              </div>
              <div class="field">
                <label for="ap-client">Assign to user</label>
                <select id="ap-client"></select>
              </div>
              <div class="field">
                <label for="ap-status">Status</label>
                <select id="ap-status">
                  <option>In Progress</option>
                  <option>Review</option>
                  <option>Complete</option>
                  <option>On Hold</option>
                </select>
              </div>
              <button type="submit" class="btn btn--primary">Save project</button>
            </form>
          </div>
          <div id="admin-projects-table" class="admin-table-wrap"></div>
        </section>

        <section class="admin-panel glass glass--static" id="admin-panel-messages" data-admin-panel="messages" hidden>
          <h1 class="service-card__title" style="margin-top: 0">Messages</h1>
          <p class="section__lead">Contact form submissions stored in this browser.</p>
          <div id="admin-messages-list"></div>
        </section>

        <section class="admin-panel glass glass--static" id="admin-panel-settings" data-admin-panel="settings" hidden>
          <h1 class="service-card__title" style="margin-top: 0">Agency settings</h1>
          <form id="agency-settings-form" class="note-form glass glass--static" style="padding: 1.25rem">
            <div class="field">
              <label for="as-name">Agency name</label>
              <input id="as-name" />
            </div>
            <div class="field">
              <label for="as-email">Contact email</label>
              <input id="as-email" type="email" />
            </div>
            <div class="field">
              <label for="as-hours">Business hours</label>
              <input id="as-hours" />
            </div>
            <div class="field">
              <label for="as-social">Social links (one per line)</label>
              <textarea id="as-social" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn--primary btn--magnetic">Save settings</button>
          </form>
        </section>
      </div>
    </main>

    <div id="admin-add-user-modal" class="admin-add-user-modal" role="dialog" aria-modal="true" aria-labelledby="admin-add-user-title" hidden>
      <div class="admin-add-user-modal__backdrop" id="admin-add-user-modal-backdrop" aria-hidden="true"></div>
      <div class="admin-add-user-modal__card glass glass--static" id="admin-add-user-modal-card">
        <h2 id="admin-add-user-title" class="service-card__title" style="margin-top: 0">Add User</h2>
        <p class="section__lead" style="margin-bottom: 1rem">Create an employee or client account. Share the temporary password securely.</p>
        <form id="admin-create-user-form" class="note-form admin-add-user-form" novalidate>
          <div class="field">
            <label for="au-name">Full Name <span aria-hidden="true">*</span></label>
            <input id="au-name" name="au-name" type="text" autocomplete="name" required aria-required="true" />
            <span class="field__error" id="au-err-name" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="au-email">Email Address <span aria-hidden="true">*</span></label>
            <input id="au-email" name="au-email" type="email" autocomplete="email" required aria-required="true" />
            <span class="field__error" id="au-err-email" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="au-company">Company / Business Name</label>
            <input id="au-company" name="au-company" type="text" autocomplete="organization" />
          </div>
          <div class="field">
            <label for="au-phone">Phone Number</label>
            <input id="au-phone" name="au-phone" type="tel" autocomplete="tel" />
          </div>
          <div class="field">
            <label for="au-role">Role <span aria-hidden="true">*</span></label>
            <select id="au-role" name="au-role" required aria-required="true">
              <option value="client">Client</option>
              <option value="employee">Employee</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="field">
            <label for="au-password">Temporary Password <span aria-hidden="true">*</span></label>
            <input id="au-password" name="au-password" type="password" autocomplete="new-password" minlength="8" required aria-required="true" />
            <span class="field__error" id="au-err-password" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="au-password2">Confirm Temporary Password <span aria-hidden="true">*</span></label>
            <input id="au-password2" name="au-password2" type="password" autocomplete="new-password" minlength="8" required aria-required="true" />
            <span class="field__error" id="au-err-password2" aria-live="polite"></span>
          </div>
          <div class="field field--row">
            <input id="au-force-pw" name="au-force-pw" type="checkbox" checked />
            <label for="au-force-pw">Force Password Change on First Login</label>
          </div>
          <div class="admin-add-user-modal__actions">
            <button type="button" class="btn btn--magnetic" id="admin-add-user-cancel">Cancel</button>
            <button type="submit" class="btn btn--primary btn--magnetic">Create Account</button>
          </div>
        </form>
      </div>
    </div>

    <div id="admin-modal" class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title" hidden>
      <div class="admin-modal__card">
        <h2 id="admin-modal-title" class="service-card__title" style="margin-top: 0">Confirm</h2>
        <p id="admin-modal-body" class="section__lead" style="margin-bottom: 1rem"></p>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end">
          <button type="button" class="btn btn--magnetic" id="admin-modal-cancel">Cancel</button>
          <button type="button" class="btn btn--primary" id="admin-modal-confirm">Confirm</button>
        </div>
      </div>
    </div>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="main.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
